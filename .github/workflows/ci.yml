# Runs the test suite. The tests use fakes, so no Amazon credentials or
# browser are needed.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install
      run: pip install -r requirements.txt

    - name: Test
      run: python -m pytest
